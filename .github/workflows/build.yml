name: N60Pro Firmware Build

on:
  workflow_dispatch:
    inputs:
      clean_cache:
        description: '忽略缓存全新编译'
        required: false
        default: 'false'
        type: boolean
  schedule:
    - cron: '0 18 * * 5'   # 每周六 02:00 (UTC+8) 自动跟源码重编

env:
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase
  REPO_BRANCH: 25.12
  CONFIG_FILE: configs/n60pro.config
  DIY_P1_SH: scripts/diy-part1.sh

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --force
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          df -hT

      - name: Init build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libncursesw5-dev \
            libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp \
            nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo -E timedatectl set-timezone "Asia/Shanghai"

      - name: Cache toolchain
        if: inputs.clean_cache != true
        uses: actions/cache@v4
        with:
          path: |
            staging_dir
            toolchain
            .ccache
          key: n60pro-toolchain-${{ env.REPO_BRANCH }}-${{ hashFiles('configs/n60pro.config') }}
          restore-keys: n60pro-toolchain-${{ env.REPO_BRANCH }}-

      - name: Clone source
        run: |
          df -hT $PWD
          git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt
          cd openwrt
          echo "=== source head ==="
          git log -1 --format='%h %s (%cd)' --date=short

      - name: Apply QModem feed
        working-directory: openwrt
        run: |
          chmod +x $GITHUB_WORKSPACE/$DIY_P1_SH
          $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: Update & install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load config
        run: |
          cp $CONFIG_FILE openwrt/.config
          cd openwrt
          make defconfig
          echo "=== device check ==="
          grep -E 'TARGET_DEVICE|qmodem|usb3|turboacc' .config | head -30 || true

      - name: Download packages
        working-directory: openwrt
        run: |
          make download -j8
          find dl -size -1024c -exec ls -la {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        id: compile
        working-directory: openwrt
        continue-on-error: true
        run: |
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Check space usage
        if: steps.compile.outputs.status == 'success'
        run: df -hT

      - name: Upload bin directory
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-bin
          path: openwrt/bin

      - name: Organize release files
        id: organize
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          cp $GITHUB_WORKSPACE/README.md ./
          echo "FILEPATH=$PWD" >> $GITHUB_ENV

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        if: steps.compile.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: N60Pro_${{ github.run_number }}_${{ github.run_id }}
          files: ${{ env.FILEPATH }}/*
          body: |
            ## 磊科 N60 Pro 定制固件
            - 源码: chasey-dev/immortalwrt-mt798x-rebase (${{ env.REPO_BRANCH }})
            - QModem + luci-app-qmodem-next (5G模组管理)
            - 全协议模组驱动 (QMI/MBIM/NCM/ECM/RNDIS)
            - USB3.0 + UAS + automount
            - MTK HNAT 硬件加速 (turboacc-mtk)

            刷机步骤见 README.md
